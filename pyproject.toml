[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prreviewer"
version = "0.1.0"
description = "Autonomous PR reviewer: security (OWASP Top 10) + general code review, via Semgrep + hosted CodeLlama."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "unidiff>=0.7",
    "openai>=1.54",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prreviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
